<!-- Confirm dialog -->
<p-confirmdialog />

<!--Overlay de chargement -->
<app-loading-overlay></app-loading-overlay>

<!--Message flash-->
<p-toast
  position="top-right"
    [breakpoints]="{
        '960px': { width: '75vw' },
        '640px': { width: '95vw' }
    }">
></p-toast>

<!--Animation d'argent-->
<app-coin-animation></app-coin-animation>

<!-- Argent de poche restant qui s'anime en cas de changement -->
<app-remaining-money-animation></app-remaining-money-animation>

<!--navbar-->
<app-nav></app-nav>

<!-- Animation de confetti-->
@if(isDisplayConfettiAnimation$ | async) {
  <app-confetti></app-confetti>
}

<div class="page-wrapper" [class.page-enter]="animatePage()">
  <router-outlet #outlet="outlet"></router-outlet>
</div>
