<app-manager-component-container [title]="title">
  <div class="p-2">
    <p-inputNumber
      fluid
      name="newMoneyAtPeriodStart"
      [min]="0"
      mode="currency"
      currency="EUR"
      locale="fr-FR"
      inputId="newMoneyAtPeriodStart"
      [(ngModel)]="newMoneyAtPeriodStart"
      placeholder="Nouveau montant en €"
      [showButtons]="true" buttonLayout="horizontal"
    [invalid]="newMoneyAtPeriodStart === 0" />
  </div>

  <p-button fluid (onClick)="updateInitialMoney()" [disabled]="newMoneyAtPeriodStart === undefined || newMoneyAtPeriodStart === 0" severity="info">Metttre à jour</p-button>
  <!--Description-->
  <div class="w-full font-semibold flex align-items-center justify-content-center">
    <div class="p-2 text-xs text-orange-500 w-9">
      <p class="p-1"> Il s'agit de l'argent de poche disponible au début d'une nouvelle semaine ou d'un nouveau mois. </p>
      <p class="p-1"> On ne pourra jamais dépasser cette quantité durant la semaine</p>
    </div>
  </div>
</app-manager-component-container>
