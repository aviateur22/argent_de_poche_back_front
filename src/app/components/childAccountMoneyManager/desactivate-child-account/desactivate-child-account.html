<app-manager-component-container [title]="title">

   <div class="p-2">
      <input [(ngModel)]="confirmChildName" type="text" pInputText fluid/>
      <p class="text-xs font-semibold p-1">Pour désactiver le compte d'argent de poche écriver le mot <span class="text-orange-500 font-bold">{{childMoneyAccount.childName}}</span></p>
    </div>

  <p-button fluid (onClick)="desactivateAccount()" [disabled]="confirmChildName !== childMoneyAccount.childName || confirmChildName === ''"  severity="danger">Désactiver</p-button>
<!--Description-->
  <div class="w-full font-semibold flex align-items-center justify-content-center">
    <div class="p-2 text-xs text-orange-500 w-9">
      <p class="p-1"> Le compte d'argent de poche sera désactivé et inacessible. </p>
      <p class="p-1"> Cette action n'est pas reversible</p>
    </div>
  </div>
</app-manager-component-container>
